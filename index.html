<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ワーホリ英会話トレーナー</title>
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#FF8B54">
<meta name="apple-mobile-web-app-title" content="ワーホリ英会話">
<meta name="description" content="オーストラリアのワーホリで働くための英語を、職場の場面ごとに練習。11職種59シーン、ネイティブ音声とAIロールプレイ付き。完全無料・登録不要。">
<meta property="og:type" content="website">
<meta property="og:title" content="ワーホリ英会話トレーナー">
<meta property="og:description" content="オーストラリアの職場で使う英語を、場面ごとに。11職種59シーン・ネイティブ音声・AIロールプレイ。完全無料/登録不要。">
<meta property="og:image" content="https://kazufunaoka-arch.github.io/waho-english-trainer/og-image.png">
<meta property="og:url" content="https://kazufunaoka-arch.github.io/waho-english-trainer/">
<meta property="og:locale" content="ja_JP">
<meta name="twitter:card" content="summary_large_image">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #FFF6EA;        /* 夜明けの空気 */
    --card: #FFFFFF;
    --ink: #3D3428;
    --muted: #A08D77;
    --accent: #0E7C86;       /* 海のティール */
    --accent-deep: #0A5C64;
    --accent-soft: #E1F3F1;
    --line: #F2DFC4;
    --done: #17A398;
    --sun1: #FF6B4A;         /* 朝日のコーラル */
    --sun2: #FFA62B;         /* マンゴーゴールド */
    --gold: #FFC145;
    --sand: #FFEEDC;
    --shadow: 0 6px 20px rgba(255, 128, 60, 0.10);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  button { touch-action: manipulation; font-family: inherit; }
  button:focus-visible, select:focus-visible, input:focus-visible {
    outline: 3px solid rgba(14, 124, 134, 0.4);
    outline-offset: 2px;
  }
  body {
    font-family: "Zen Maru Gothic", "Hiragino Maru Gothic ProN", "Yu Gothic UI", sans-serif;
    background: var(--paper);
    color: var(--ink);
    line-height: 1.75;
  }

  /* ===== ヒーロー: ゴールドコーストの夜明け ===== */
  header {
    position: relative;
    background: linear-gradient(180deg, #FF8B54 0%, #FFB65C 48%, #FFD98E 100%);
    padding: 38px 20px 66px;
    text-align: center;
    overflow: hidden;
  }
  .hero-sun {
    position: absolute;
    left: 50%;
    bottom: -50px;
    transform: translateX(-50%);
    width: 240px;
    height: 240px;
    border-radius: 50%;
    background: radial-gradient(circle, #FFF6CE 0%, #FFD166 42%, rgba(255, 209, 102, 0) 72%);
    pointer-events: none;
  }
  .hero-inner { position: relative; z-index: 2; }
  .hero-eyebrow {
    font-family: "Quicksand", sans-serif;
    font-weight: 700;
    font-size: 0.68rem;
    letter-spacing: 0.28em;
    color: rgba(255, 255, 255, 0.9);
  }
  .hero-lockup {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    margin-top: 4px;
  }
  .hero-mark {
    width: 46px;
    height: 46px;
    flex-shrink: 0;
    border-radius: 12px;
    box-shadow: 0 4px 12px rgba(170, 70, 20, 0.28);
  }
  header h1 {
    font-size: 1.55rem;
    font-weight: 900;
    color: #fff;
    letter-spacing: 0.03em;
    text-shadow: 0 2px 14px rgba(196, 78, 22, 0.35);
    margin-top: 2px;
  }
  .hero-tag {
    color: #fff;
    font-weight: 700;
    font-size: 0.92rem;
    margin-top: 4px;
    text-shadow: 0 1px 8px rgba(196, 78, 22, 0.3);
  }
  .hero-chips { margin-top: 12px; }
  .hero-chips .chip {
    display: inline-block;
    background: rgba(255, 255, 255, 0.92);
    color: var(--ink);
    border-radius: 999px;
    padding: 5px 16px;
    font-weight: 700;
    font-size: 0.84rem;
    box-shadow: 0 3px 10px rgba(180, 80, 20, 0.2);
  }
  .hero-waves {
    position: absolute;
    left: 0;
    bottom: -1px;
    width: 100%;
    height: 58px;
    display: block;
    z-index: 1;
  }

  /* ===== 操作バー ===== */
  .controls {
    position: sticky;
    top: 0;
    z-index: 20;
    background: rgba(255, 246, 234, 0.92);
    backdrop-filter: blur(8px);
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 16px;
    max-width: 860px;
    margin: 0 auto;
  }
  .controls button {
    border: 2px solid var(--line);
    background: #fff;
    border-radius: 999px;
    padding: 6px 16px;
    font-weight: 700;
    font-size: 0.8rem;
    color: var(--muted);
    cursor: pointer;
    transition: all 0.15s;
  }
  .controls button:hover { color: var(--accent); border-color: var(--accent); }
  .controls button.active {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
    box-shadow: 0 4px 10px rgba(14, 124, 134, 0.25);
  }
  .controls button:last-child { margin-left: auto; }
  .controls select {
    border: 2px solid var(--line);
    background: #fff;
    border-radius: 999px;
    padding: 6px 10px;
    font-size: 0.74rem;
    color: var(--muted);
    max-width: 36%;
    font-family: inherit;
  }

  /* ===== 職場ナビ ===== */
  #job-nav {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    padding: 18px 16px 6px;
    max-width: 860px;
    margin: 0 auto;
  }
  #job-nav button {
    border: 2px solid var(--line);
    background: #fff;
    border-radius: 14px;
    padding: 8px 14px;
    font-weight: 700;
    font-size: 0.86rem;
    color: var(--ink);
    cursor: pointer;
    box-shadow: 0 2px 0 var(--line);
    transition: transform 0.12s, box-shadow 0.12s, background 0.12s;
  }
  #job-nav button:hover { transform: translateY(-2px); }
  #job-nav button:active { transform: scale(0.96); }
  #job-nav button.active {
    background: linear-gradient(135deg, var(--accent), #15939E);
    color: #fff;
    border-color: transparent;
    box-shadow: 0 5px 14px rgba(14, 124, 134, 0.35);
  }

  /* ===== シーンナビ ===== */
  nav {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    padding: 10px 16px 4px;
    max-width: 860px;
    margin: 0 auto;
  }
  nav button {
    border: 1.5px solid var(--line);
    background: #fff;
    border-radius: 999px;
    padding: 5px 13px;
    font-size: 0.78rem;
    font-weight: 700;
    color: var(--muted);
    cursor: pointer;
    transition: all 0.12s;
  }
  nav button:hover { color: var(--sun1); border-color: var(--sun1); }
  nav button.active {
    background: linear-gradient(135deg, var(--sun1), var(--sun2));
    border-color: transparent;
    color: #fff;
    box-shadow: 0 4px 10px rgba(255, 107, 74, 0.3);
  }
  nav button.done { border-color: var(--done); }
  nav button.done::after { content: " ✓"; color: var(--done); font-weight: 900; }
  nav button.active.done::after { color: #fff; }

  main { max-width: 820px; margin: 0 auto; padding: 8px 18px 90px; }

  .scene-header { margin: 22px 0 6px; }
  .scene-header h2 { font-size: 1.28rem; font-weight: 900; }
  .scene-header p { color: var(--muted); font-size: 0.88rem; margin-top: 4px; }

  /* ネイティブ音声カード */
  .shadow-audio {
    display: flex;
    align-items: center;
    gap: 10px;
    margin: 14px 0 6px;
    background: var(--sand);
    border-radius: 16px;
    padding: 10px 14px;
    flex-wrap: wrap;
    box-shadow: var(--shadow);
  }
  .shadow-audio audio { height: 36px; max-width: 100%; flex: 1; min-width: 220px; }

  .scene-actions { display: flex; gap: 8px; margin: 12px 0 22px; flex-wrap: wrap; align-items: center; }
  .scene-actions button {
    border: 2px solid var(--line);
    background: #fff;
    color: var(--ink);
    border-radius: 999px;
    padding: 8px 16px;
    font-weight: 700;
    font-size: 0.82rem;
    cursor: pointer;
    transition: transform 0.12s, border-color 0.12s, color 0.12s;
  }
  .scene-actions button:hover { border-color: var(--accent); color: var(--accent); }
  .scene-actions button:active { transform: scale(0.95); }

  /* ===== 会話バブル ===== */
  .line {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    margin-bottom: 14px;
  }
  .line.staff { align-items: flex-end; }
  .who {
    font-size: 0.68rem;
    font-weight: 700;
    letter-spacing: 0.08em;
    color: var(--muted);
    margin: 0 10px 3px;
  }
  .line.staff .who { color: var(--accent); }
  .bubble {
    max-width: 80%;
    padding: 11px 16px;
    border-radius: 18px;
    background: var(--card);
    box-shadow: 0 3px 12px rgba(160, 120, 60, 0.10);
  }
  .line.customer .bubble { border-bottom-left-radius: 6px; }
  .line.staff .bubble { background: var(--accent-soft); border-bottom-right-radius: 6px; }
  .en {
    font-family: "Quicksand", "Zen Maru Gothic", sans-serif;
    font-weight: 600;
    font-size: 1rem;
  }
  .ja { font-size: 0.8rem; color: var(--muted); margin-top: 3px; }
  body.hide-ja .ja { display: none; }

  .play-btn {
    background: none;
    border: none;
    color: var(--sun2);
    cursor: pointer;
    font-size: 0.9rem;
    margin-left: 8px;
    padding: 0 2px;
    vertical-align: middle;
  }
  .play-btn:hover { color: var(--sun1); }

  /* ロールプレイモード: 自分のセリフを隠す */
  body.roleplay .line.staff .bubble.hidden-answer .en,
  body.roleplay .line.staff .bubble.hidden-answer .ja,
  body.roleplay .line.staff .bubble.hidden-answer .play-btn { display: none; }
  body.roleplay .line.staff .bubble.hidden-answer::after {
    content: "🌊 あなたの番 — 声に出して言ってから、ここを押して答え合わせ";
    display: block;
    color: var(--sun1);
    font-weight: 700;
    font-size: 0.82rem;
    padding: 4px 0;
    cursor: pointer;
  }
  body.roleplay .line.staff .bubble.hidden-answer {
    cursor: pointer;
    background: #FFF9F3;
    border: 2px dashed var(--sun1);
  }

  /* ポイント */
  .tips {
    background: var(--sand);
    border-radius: 16px;
    padding: 16px 18px;
    margin: 26px 0;
    font-size: 0.87rem;
    box-shadow: var(--shadow);
  }
  .tips h3 {
    font-size: 0.78rem;
    font-weight: 900;
    letter-spacing: 0.1em;
    color: #D45A2A;
    margin-bottom: 8px;
  }
  .tips h3::before { content: "🌞 "; }
  .tips li { margin-left: 18px; margin-bottom: 6px; color: #5B4C39; }

  .complete-row { text-align: center; margin-top: 26px; }
  .complete-row button {
    background: linear-gradient(135deg, var(--sun1), var(--sun2));
    color: #fff;
    border: none;
    border-radius: 999px;
    padding: 12px 30px;
    font-weight: 900;
    font-size: 0.95rem;
    cursor: pointer;
    box-shadow: 0 6px 16px rgba(255, 107, 74, 0.35);
    transition: transform 0.12s;
  }
  .complete-row button:hover { transform: translateY(-2px); }
  .complete-row button:active { transform: scale(0.95); }
  .complete-row button.completed {
    background: linear-gradient(135deg, var(--done), #4CC9B0);
    box-shadow: 0 6px 16px rgba(23, 163, 152, 0.3);
  }

  /* キーフレーズ・単語帳テーブル */
  table {
    width: 100%;
    border-collapse: separate;
    border-spacing: 0;
    margin: 10px 0 26px;
    font-size: 0.88rem;
    background: #fff;
    border-radius: 14px;
    overflow: hidden;
    box-shadow: var(--shadow);
  }
  th {
    text-align: left;
    font-size: 0.7rem;
    font-weight: 900;
    letter-spacing: 0.08em;
    color: #fff;
    background: var(--accent);
    padding: 8px 12px;
  }
  td { padding: 9px 12px; border-bottom: 1px solid #F7EBD8; vertical-align: top; }
  tr:last-child td { border-bottom: none; }
  td.en-cell { font-family: "Quicksand", sans-serif; font-weight: 600; }
  td .play-btn { margin-left: 4px; }
  h3.section-title { font-size: 1.02rem; font-weight: 900; margin: 30px 0 2px; }
  .section-note { color: var(--muted); font-size: 0.82rem; }

  footer { text-align: center; color: var(--muted); font-size: 0.76rem; padding: 24px 20px 40px; }

  /* ===== AIロールプレイ ===== */
  .chat-input-row { display: flex; gap: 8px; margin: 18px 0; }
  .chat-input-row input {
    flex: 1;
    min-width: 0;
    border: 2px solid var(--line);
    border-radius: 999px;
    padding: 10px 16px;
    font-size: 16px;
    font-family: inherit;
    background: #fff;
    color: var(--ink);
  }
  .chat-input-row input:focus { outline: none; border-color: var(--accent); }
  .chat-input-row button {
    border: 2px solid var(--line);
    background: #fff;
    color: var(--ink);
    border-radius: 999px;
    padding: 10px 16px;
    cursor: pointer;
    font-size: 0.9rem;
    font-weight: 700;
    white-space: nowrap;
    transition: transform 0.12s;
  }
  .chat-input-row button:hover { border-color: var(--accent); color: var(--accent); }
  .chat-input-row button:active { transform: scale(0.95); }
  #mic-btn.listening {
    background: linear-gradient(135deg, var(--sun1), var(--sun2));
    color: #fff;
    border-color: transparent;
    animation: mic-pulse 1.2s infinite;
  }
  @keyframes mic-pulse { 50% { opacity: 0.55; } }
  @media (prefers-reduced-motion: reduce) { #mic-btn.listening { animation: none; } }
  .voice-help {
    background: var(--sand);
    border-radius: 14px;
    padding: 12px 16px;
    margin: 14px 0;
    font-size: 0.85rem;
  }
  .voice-help summary { cursor: pointer; font-weight: 700; color: #D45A2A; }
  .voice-help p { margin-top: 8px; }
  .voice-help ol { margin: 6px 0 6px 20px; }
  .voice-help li { margin-bottom: 4px; }
  .ai-error { color: #C0392B; font-size: 0.85rem; margin: 10px 0; text-align: center; font-weight: 700; }
  .ai-hint { text-align: center; color: var(--muted); font-size: 0.85rem; margin: 26px 0; }

  /* ===== 瞬間英作文 ===== */
  .sed-card {
    background: #fff;
    border-radius: 20px;
    padding: 34px 24px;
    text-align: center;
    margin: 22px 0;
    box-shadow: 0 8px 26px rgba(255, 128, 60, 0.14);
  }
  .sed-ja { font-size: 1.15rem; font-weight: 700; line-height: 1.7; }
  .sed-en {
    font-family: "Quicksand", sans-serif;
    font-weight: 600;
    font-size: 1.05rem;
    margin-top: 16px;
    color: var(--accent);
  }
  .sed-timer {
    height: 6px;
    background: var(--sand);
    margin: 20px auto 0;
    width: 70%;
    border-radius: 3px;
    overflow: hidden;
  }
  .sed-timer > div {
    height: 100%;
    background: linear-gradient(90deg, var(--sun1), var(--sun2));
    animation: sed-shrink 2s linear forwards;
  }
  @keyframes sed-shrink { from { width: 100%; } to { width: 0; } }
  @media (prefers-reduced-motion: reduce) { .sed-timer > div { animation: none; } }
  .sed-btns { display: flex; gap: 10px; justify-content: center; margin-top: 22px; flex-wrap: wrap; }
  .sed-btns button {
    border: 2px solid var(--line);
    background: #fff;
    border-radius: 999px;
    padding: 12px 24px;
    font-size: 0.95rem;
    font-weight: 700;
    cursor: pointer;
    color: var(--ink);
    transition: transform 0.12s;
  }
  .sed-btns button:hover { border-color: var(--accent); }
  .sed-btns button:active { transform: scale(0.94); }
  .sed-btns .sed-ok {
    background: var(--done);
    border-color: transparent;
    color: #fff;
    box-shadow: 0 4px 12px rgba(23, 163, 152, 0.3);
  }
  .sed-btns .sed-ng { border-color: #E76F51; color: #E76F51; }
  .sed-select {
    border: 2px solid var(--line);
    background: #fff;
    color: var(--ink);
    padding: 6px 10px;
    border-radius: 999px;
    font-family: inherit;
    font-size: 0.82rem;
  }

  /* ===== モバイル ===== */
  @media (max-width: 600px) {
    header { padding: 30px 16px 58px; }
    header h1 { font-size: 1.18rem; }
    .hero-mark { width: 38px; height: 38px; border-radius: 10px; }
    .hero-lockup { gap: 9px; }
    .hero-tag { font-size: 0.85rem; }
    .bubble { max-width: 88%; }
    .play-btn { font-size: 1.05rem; padding: 2px 8px; }
    .scene-actions button { padding: 9px 15px; }
    .controls { flex-wrap: wrap; }
    .controls select { max-width: 44%; }
    main { padding: 8px 14px calc(70px + env(safe-area-inset-bottom)); }
  }
</style>
</head>
<body class="hide-ja-no">

<header>
  <div class="hero-sun"></div>
  <div class="hero-inner">
    <div class="hero-eyebrow">GOLD COAST MORNING</div>
    <div class="hero-lockup">
      <svg class="hero-mark" viewBox="0 0 512 512" aria-hidden="true">
        <defs>
          <linearGradient id="logoSky" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#FF6B4A"/><stop offset=".55" stop-color="#FFA62B"/><stop offset="1" stop-color="#FFC145"/>
          </linearGradient>
          <clipPath id="logoSq"><rect width="512" height="512" rx="115"/></clipPath>
        </defs>
        <g clip-path="url(#logoSq)">
          <rect width="512" height="512" fill="url(#logoSky)"/>
          <circle cx="256" cy="248" r="150" fill="#FFF6CE" opacity=".35"/>
          <circle cx="256" cy="248" r="94" fill="#FFF8E7"/>
          <path d="M0,330 C90,300 160,368 256,344 C356,318 424,372 512,338 L512,512 L0,512 Z" fill="#fff" opacity=".5"/>
          <path d="M0,378 C100,346 172,412 272,386 C372,360 436,414 512,388 L512,512 L0,512 Z" fill="#0E7C86"/>
        </g>
      </svg>
      <h1>ワーホリ英会話トレーナー</h1>
    </div>
    <p class="hero-tag">Have a crack, mate.</p>
    <div class="hero-chips"><span class="chip" id="streak-chip">☀️ 今日から始めよう</span></div>
  </div>
  <svg class="hero-waves" viewBox="0 0 1440 90" preserveAspectRatio="none" aria-hidden="true">
    <path d="M0,42 C240,88 480,8 720,32 C960,56 1200,18 1440,48 L1440,90 L0,90 Z" fill="rgba(255,255,255,0.4)"/>
    <path d="M0,62 C260,26 520,88 780,60 C1040,32 1240,80 1440,56 L1440,90 L0,90 Z" fill="#FFF6EA"/>
  </svg>
</header>

<div class="controls">
  <button id="mode-study" class="active" onclick="setMode('study')">学習</button>
  <button id="mode-roleplay" onclick="setMode('roleplay')">ロールプレイ</button>
  <select id="voice-select" onchange="changeVoice(this.value)" title="英語の音声を選ぶ"></select>
  <button id="toggle-ja" class="active" onclick="toggleJa()">和訳を隠す</button>
</div>

<nav id="job-nav"></nav>
<nav id="nav"></nav>
<main id="main"></main>

<footer>音声は端末の読み上げ機能(Web Speech API)を使用。上のメニューで声を変更できます。<br>iPhoneの場合:設定 → アクセシビリティ → 読み上げコンテンツ → 声 → 英語 で「Karen(拡張)」等をダウンロードすると、より自然な声が選べるようになります。<br>進捗はこのブラウザに自動保存されます。</footer>

<script>
const STEAK_SCENES = [
{
  id: "greeting",
  title: "1. 出迎え・席案内",
  emoji: "🚪",
  desc: "お客さんが入店した最初の瞬間。第一印象が決まる大事な場面。",
  tips: [
    "オーストラリアでは \"How are you going?\" が定番のあいさつ(going = doing)。",
    "\"No worries\" は「かしこまりました/大丈夫ですよ」として何にでも使える万能フレーズ。",
    "満席のときは正直に待ち時間を伝えて、名前を聞いてリストに載せる。"
  ],
  lines: [
    { sp: "S", en: "Hi there! Welcome to Aussie Grill. How are you going today?", ja: "いらっしゃいませ、オージーグリルへようこそ!今日の調子はどうですか?" },
    { sp: "C", en: "Good, thanks. Table for two, please.", ja: "元気です、ありがとう。2名でお願いします。" },

function loadVoices() {
  voices = speechSynthesis.getVoices();
  renderVoiceSelect();
}
if ("speechSynthesis" in window) {
  loadVoices();
  speechSynthesis.onvoiceschanged = loadVoices;
}

// オージー英語(en-AU)を最優先し、高音質(Natural/Enhanced)を選ぶスコア付け
function voiceScore(v) {
  let s = 0;
  const n = v.name.toLowerCase();
  const lang = (v.lang || "").toLowerCase().replace("_", "-");
  if (lang.startsWith("en-au")) s += 10;      // オージー英語を最優先
  else if (lang.startsWith("en-gb")) s += 3;
  else if (lang.startsWith("en-us")) s += 2;
  else if (lang.startsWith("en-in")) s -= 8;  // インド英語は最後尾へ
  if (n.includes("natural") || n.includes("neural")) s += 4;
  if (n.includes("enhanced") || n.includes("premium") || n.includes("拡張") || n.includes("プレミアム")) s += 4;
  if (n.includes("siri")) s += 5;
  if (n.includes("multilingual") || n.includes("マルチリンガル")) s -= 3; // 多言語音声はアクセントが平板になりがち
  if (n.includes("natasha") || n.includes("william") || n.includes("karen")) s += 1; // 豪の代表ボイス
  return s;
}

function englishVoices() {
  return voices
    .filter(v => v.lang.toLowerCase().startsWith("en"))
    .sort((a, b) => voiceScore(b) - voiceScore(a));
}

function pickVoice() {
  const list = englishVoices();
  if (savedVoiceName) {
    const v = list.find(v => v.name === savedVoiceName);
    // 手動選択がインド英語だった場合は無視して自動選択に戻す
    if (v && !(v.lang || "").toLowerCase().replace("_", "-").startsWith("en-in")) return v;
  }
  return list[0] || null;
}

function renderVoiceSelect() {
  const sel = document.getElementById("voice-select");
  if (!sel) return;
  const list = englishVoices();
  if (!list.length) { sel.innerHTML = "<option>英語音声なし</option>"; return; }
  const current = pickVoice();
  sel.innerHTML = list.map(v =>
    `<option value="${esc(v.name)}"${current && v.name === current.name ? " selected" : ""}>🔊 ${esc(v.name)} (${v.lang})</option>`
  ).join("");
}

function changeVoice(name) {
  savedVoiceName = name;
  localStorage.setItem("voiceName", name);
  speak("G'day! How are you going today?", false);
}

function speak(text, isCustomer, onend) {
  if (!("speechSynthesis" in window)) { alert("このブラウザは音声読み上げに対応していません。"); return; }
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  const v = pickVoice();
  if (v) u.voice = v;
  u.lang = v ? v.lang : "en-AU";
  u.rate = 0.92;
  u.pitch = isCustomer ? 1.1 : 1.0;
  if (onend) u.onend = onend;
  speechSynthesis.speak(u);
}

function playAll(sceneIdx) {
  if (!("speechSynthesis" in window)) return;
  speechSynthesis.cancel();
  const lines = SCENES[sceneIdx].lines;
  let i = 0;
  function next() {
    if (i >= lines.length) return;
    const line = lines[i];
    const u = new SpeechSynthesisUtterance(line.en);
    const v = pickVoice();
    if (v) u.voice = v;
    u.rate = 0.92;
    u.pitch = line.sp === "C" ? 1.1 : 1.0;
    u.onend = () => { i++; setTimeout(next, 500); };
    // ハイライト
    document.querySelectorAll(".line").forEach((el, idx) => {
      el.style.opacity = idx === i ? "1" : "0.45";
    });
    speechSynthesis.speak(u);
  }
  next();
}

function stopAll() {
  speechSynthesis.cancel();
  document.querySelectorAll(".line").forEach(el => el.style.opacity = "1");
}

function setMode(m) {
  mode = m;
  document.body.classList.toggle("roleplay", m === "roleplay");
  document.getElementById("mode-study").classList.toggle("active", m === "study");
  document.getElementById("mode-roleplay").classList.toggle("active", m === "roleplay");
  renderScene();
}

function toggleJa() {
  showJa = !showJa;

  const btn = document.getElementById("toggle-ja");
  btn.textContent = showJa ? "和訳を隠す" : "和訳を表示";
  btn.classList.toggle("active", showJa);
}

function toggleComplete(id) {
  progress[id] = !progress[id];
  if (progress[id]) celebrate();
  localStorage.setItem("steakProgress", JSON.stringify(progress));

}

function esc(s) { return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/"/g,"&quot;"); }

    html += `<button class="${cls}" onclick="goScene(${i})">${esc(s.title)}</button>`;

/* ===== AIロールプレイ(オージー英語のAI会話練習) ===== */
const CHAT_MODEL = "claude-haiku-4-5";      // 会話ターン: 軽量・低コスト
const FEEDBACK_MODEL = "claude-opus-4-8";   // 総評: 高精度モデルで丁寧に
const JOB_SETTINGS = {
  steak: "a casual steakhouse restaurant",
  cafe: "a busy specialty cafe",
  gym: "a 24/7 gym (the learner works at the front desk and on the gym floor)",
  swim: "a swim school (the learner is a swimming instructor assistant; the other party may be a parent or a young child)",
  airport: "an airport (the learner is ground staff at check-in and the boarding gate)",
  flightexp: "a Boeing 737 flight simulator experience attraction in Surfers Paradise (the learner is front-desk staff and instructor)",
  interview: "a job interview / trial shift at a hospitality venue (you are the hiring manager or a senior colleague)",
  hotel: "a hotel on the Gold Coast (the learner is a housekeeper / room attendant)",
  thai: "a Thai restaurant (the learner waits tables, takes phone orders, and helps as a kitchen hand)",
  kebab: "a kebab shop in Surfers Paradise (the learner takes orders and makes kebabs, including late-night shifts)",
  uber: "Uber Eats delivery on the Gold Coast (the learner is the delivery rider/driver, picking up from restaurants and dropping off to customers, often at high-rise apartments in Surfers Paradise)",
  bar: "a busy bar/pub on the Gold Coast (the learner is a bartender). Australian RSA rules apply: ID anyone who looks under 25, and refuse service to anyone who is intoxicated. Beer comes in pots, schooners, pints and jugs.",
  japanese: "a Japanese restaurant on the Gold Coast (the learner is Japanese and waits tables, explaining Japanese food to Australian customers who are often unfamiliar with it)",
  demipair: "an Australian host family's home on the Gold Coast (the learner is a demi pair — childcare and light housework in exchange for homestay, while studying at a language school)"
};

const AI_ROLES = {
  MANAGER: "hiring manager or senior colleague",
  SUPERVISOR: "housekeeping supervisor who gives instructions and receives reports",
  GUEST: "hotel guest",
  CHEF: "head chef or kitchen coworker giving instructions",
  COWORKER: "coworker on the same shift",
  RESTAURANT: "restaurant staff member handing over a delivery order at the pickup counter",
  PARENT: "host parent of the family (warm, appreciative, occasionally asking about the kids or setting house rules)",
  KID: "young child of the host family, about 4-7 years old — speak in very short, simple, playful sentences, sometimes whiny or easily distracted, like a real kid"
};

let apiKey = localStorage.getItem("anthropicApiKey") || "";
let aiChat = null;

function startAIChat(sceneIdx) {
  stopAll();
  const job = JOBS[currentJob];
  aiChat = {
    scene: SCENES[sceneIdx],
    sceneIdx: sceneIdx,
    jobId: job.id,
    youLabel: job.youLabel || "YOU",
    otherLabel: SCENES[sceneIdx].otherLabel || job.otherLabel || "CUSTOMER",
    messages: [],
    waiting: false,
    error: null,
    feedback: null,
    handsFree: false
  };
  renderAIChat();
  window.scrollTo({ top: 0, behavior: "smooth" });
}

function exitAIChat() {
  aiChat = null;
  renderScene();
}

function aiSystemPrompt(chat) {
  const ref = chat.scene.lines.slice(0, 6)
    .map(l => `${l.sp === "S" ? "STAFF" : chat.otherLabel}: ${l.en}`).join("\n");
  return `You are an English conversation partner helping a Japanese working-holiday maker practise workplace English through role-play.

Setting: ${JOB_SETTINGS[chat.jobId] || "a workplace"} on the Gold Coast, Australia.
Scene: ${chat.scene.title} — ${chat.scene.desc}
Your role: you play the ${AI_ROLES[chat.otherLabel] || "customer (or whoever the staff member serves in this scene)"}. The learner plays the staff member and speaks first.

ROLE LOCK (most important rule):
- You are ALWAYS the ${AI_ROLES[chat.otherLabel] || "customer"}. The learner is ALWAYS the staff member. Never swap these roles, no matter what.
- The learner speaks through voice recognition, so their messages are often fragments, cut off mid-sentence, misheard, or missing words. This is normal — do NOT treat a fragment as a role change.
- If a message sounds like something YOUR character would say, or reads like the staff line you were expecting, it is still the learner talking. Stay in your role and respond as your character.
- If a message is incomplete or makes no sense, do not guess wildly and do not narrate both sides. Reply in character with a short, natural clarification: "Sorry mate?", "Say that again?", "Hang on, what was that?"
- Never write the learner's lines for them. Output only your own character's next line.

Guidelines:
- Speak natural, friendly Australian English (no worries, heaps, arvo, ta, mate...). Keep each reply to 1-2 short, spoken-style sentences.
- Stay in character and within this scene. React naturally and move the situation forward; occasionally add a realistic twist such as a special request, a follow-up question, or a mild complaint.
- Match the learner's level: if they struggle, use simpler English and slow the scene down. If they write in Japanese or ask for help, help briefly via the tip (in Japanese) but keep your reply in English and in character.
- tip: if the learner's last message has a clear error or a much more natural phrasing, give ONE short tip in Japanese (about 60 characters max), e.g. 「★5 wait → Could you wait... の方が丁寧」. If their English was fine, use null.

Reference dialogue for tone (do not copy it verbatim):
${ref}`;
}

async function callClaude(body) {
  const res = await fetch("https://api.anthropic.com/v1/messages", {
    method: "POST",
    headers: {
      "content-type": "application/json",
      "x-api-key": apiKey,
      "anthropic-version": "2023-06-01",
      "anthropic-dangerous-direct-browser-access": "true"
    },
    body: JSON.stringify(body)
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) {
    const err = new Error((data.error && data.error.message) || ("HTTP " + res.status));
    err.status = res.status;
    throw err;
  }
  return data;
}

function aiErrorMessage(e) {
  if (e.status === 401) return "APIキーが無効です。「キーを変更」から設定し直してください。";
  if (e.status === 429) return "リクエストが多すぎます。少し待ってからもう一度どうぞ。";
  if (e.status >= 500) return "Anthropic側が混み合っています。少し待ってからもう一度どうぞ。";
  return "エラーが発生しました: " + e.message;
}

async function sendChat() {
  if (!aiChat || aiChat.waiting) return;
  const input = document.getElementById("chat-input");
  const text = input ? input.value.trim() : "";
  if (!text) return;
  aiChat.messages.push({ role: "user", content: text });
  aiChat.waiting = true;
  aiChat.error = null;
  renderAIChat();
  try {
    const data = await callClaude({
      model: CHAT_MODEL,
      max_tokens: 1024,
      system: aiSystemPrompt(aiChat),
      output_config: {
        format: {
          type: "json_schema",
          schema: {
            type: "object",
            properties: {
              reply: { type: "string", description: "Your next line in English, staying in character. 1-2 short spoken sentences." },
              tip: { anyOf: [{ type: "string" }, { type: "null" }], description: "One short Japanese tip about the learner's last message, or null if it was fine." }
            },
            required: ["reply", "tip"],
            additionalProperties: false
          }
        }
      },
      messages: aiChat.messages.map(m =>
        m.role === "user" ? { role: "user", content: m.content } : { role: "assistant", content: m.reply }
      )
    });
    if (!aiChat) return; // 画面遷移済みなら破棄
    const block = (data.content || []).find(b => b.type === "text");
    let reply = "", tip = null;
    if (block) {
      try { const p = JSON.parse(block.text); reply = p.reply || ""; tip = p.tip || null; }
      catch (e) { reply = block.text; }
    }
    if (!reply) throw new Error("応答が空でした。もう一度送信してください。");
    aiChat.messages.push({ role: "assistant", reply: reply, tip: tip });
    aiChat.waiting = false;
    renderAIChat();
    markPracticed();
    // 連続会話モード: AIの読み上げが終わったら自動でマイクを再開
    speak(reply, true, () => {
      micAutoStart();
    });
  } catch (e) {
    if (!aiChat) return;
    aiChat.waiting = false;
    aiChat.error = aiErrorMessage(e);
    const undone = aiChat.messages.pop(); // 送信失敗分を入力欄に戻す
    renderAIChat();
    const inp = document.getElementById("chat-input");
    if (inp && undone && undone.role === "user") inp.value = undone.content;
  }
}

async function endChat() {
  if (!aiChat || aiChat.waiting) return;
  if (aiChat.messages.length < 2) { aiChat.error = "まずは何往復か会話してから総評をもらいましょう。"; renderAIChat(); return; }
  aiChat.waiting = true;
  aiChat.error = null;
  renderAIChat();
  const transcript = aiChat.messages.map(m =>
    m.role === "user" ? `STAFF(学習者): ${m.content}` : `${aiChat.otherLabel}: ${m.reply}`
  ).join("\n");
  try {
    const data = await callClaude({
      model: FEEDBACK_MODEL,
      max_tokens: 1500,
      system: "You are a supportive English coach for a Japanese working-holiday maker preparing to work on the Gold Coast. You give feedback in Japanese.",
      messages: [{
        role: "user",
        content: `以下はロールプレイ練習の会話記録です(場面: ${aiChat.scene.title})。学習者(STAFF)の英語について日本語で総評してください。構成: ①良かった点(2〜3個) ②改善点(2〜3個、より自然な言い方の例文付き) ③この場面で丸暗記すべきフレーズ3つ。励ます調子で、簡潔に。\n\n${transcript}`
      }]
    });
    if (!aiChat) return;
    aiChat.feedback = (data.content || []).filter(b => b.type === "text").map(b => b.text).join("");
    aiChat.waiting = false;
    renderAIChat();
    celebrate();
  } catch (e) {
    if (!aiChat) return;
    aiChat.waiting = false;
    aiChat.error = aiErrorMessage(e);
    renderAIChat();
  }
}

           Microsoft Edge が最も高品質な音声を持っています(Chromeで機械っぽい場合はEdgeでこのページを開いてみてください)。</p>`}
      <p class="section-note">※ シーンの🎧ネイティブ音声は最初から高品質です。ここで直るのはAIの返答の声だけです。</p>
    </details>`;
  document.getElementById("main").innerHTML = html;
  const inp = document.getElementById("chat-input");
  if (inp && !aiChat.waiting) inp.focus();
  window.scrollTo({ top: document.body.scrollHeight, behavior: "smooth" });
}

const IS_IOS = /iPad|iPhone|iPod/.test(navigator.userAgent) ||
  (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
const IS_STANDALONE = window.navigator.standalone === true ||
  (window.matchMedia && window.matchMedia("(display-mode: standalone)").matches);

let micRec = null, micListening = false, micTranscript = "", micBase = "";
let micSilenceTimer = null, micWantStop = false, micAccum = "", micMaxTimer = null;
const MIC_SILENCE_MS = 2600;   // これだけ黙ったら「話し終わり」とみなす
const MIC_MAX_MS = 60000;      // 保険: 60秒で強制終了

function micSetBtn(on) {
  micListening = on;
  const b = document.getElementById("mic-btn");
  if (b) b.classList.toggle("listening", on);
}

function micError(msg) {
  if (!aiChat) return;
  aiChat.error = msg;
  renderAIChat();
}

function micClearTimers() {
  clearTimeout(micSilenceTimer); micSilenceTimer = null;
  clearTimeout(micMaxTimer); micMaxTimer = null;
}

function micFinish() {
  micClearTimers();
  micSetBtn(false);
  micRec = null;
  if (micTranscript) sendChat();
}

function micBuildRec() {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  const rec = new SR();
  rec.lang = "en-AU";
  rec.interimResults = true;   // iOSは中間結果しか返さないことがある
  rec.continuous = true;       // 一息ついても切れないように
  rec.maxAlternatives = 1;

  rec.onstart = () => micSetBtn(true);

  rec.onresult = e => {
    let t = "";
    for (let i = 0; i < e.results.length; i++) t += e.results[i][0].transcript;
    micTranscript = (micAccum + " " + t).trim();
    const el = document.getElementById("chat-input");
    if (el) el.value = (micBase ? micBase + " " : "") + micTranscript; // 話しながら表示
    // 話すたびにタイマーをリセット。黙って初めて送信される
    clearTimeout(micSilenceTimer);
    micSilenceTimer = setTimeout(() => {
      micWantStop = true;
      try { rec.stop(); } catch (err) { micFinish(); }
    }, MIC_SILENCE_MS);
  };

  rec.onerror = e => {
    const code = e && e.error;
    if (code === "no-speech" || code === "aborted") return; // onendで処理
    micWantStop = true;
    micClearTimers();
    micSetBtn(false);
    if (code === "not-allowed" || code === "service-not-allowed") {
      micError(IS_STANDALONE
        ? "マイクを使えません。ホーム画面のアプリではなく、Safariでこのページを開いてお試しください。"
        : "マイクの使用が許可されていません。設定 → Safari → マイク を「許可」にしてください。キーボードの🎤(音声入力)でも入力できます。");
    } else if (code === "audio-capture") {
      micError("マイクが見つかりませんでした。");
    } else if (code === "network") {
      micError("音声認識サーバーに接続できませんでした。通信環境を確認してください。");
    }
  };

  rec.onend = () => {
    // 自分で止めていない = ブラウザが勝手に切った(iOS等)→ 続きを聞き直す
    if (!micWantStop && micListening) {
      micAccum = micTranscript;
      try {
        micRec = micBuildRec();
        micRec.start();
        return;
      } catch (err) { /* 再開できなければ確定へ */ }
    }
    micFinish();
  };

  return rec;
}

function toggleMic(auto) {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) return;
  // 聞き取り中にもう一度押したら「話し終わった」の合図
  if (micListening && micRec) {
    micWantStop = true;
    micClearTimers();
    try { micRec.stop(); } catch (e) { micFinish(); }
    return;
  }

  // iOSは読み上げ中だと録音を開始できないので必ず止めてから
  try { speechSynthesis.cancel(); } catch (e) {}

  micTranscript = "";
  micAccum = "";
  micWantStop = false;
  const input = document.getElementById("chat-input");
  micBase = input ? input.value.trim() : "";

  try {
    micRec = micBuildRec();
    micRec.start();
    micListening = true;
    micMaxTimer = setTimeout(() => {
      micWantStop = true;
      if (micRec) { try { micRec.stop(); } catch (e) { micFinish(); } }
    }, MIC_MAX_MS);
  } catch (e) {
    micSetBtn(false);
    micRec = null;
    if (!auto) micError("マイクを開始できませんでした。もう一度🎤を押してみてください。");
  }
}

// 連続会話モード: 読み上げ後の自動再開(iOSはユーザー操作なしの起動が塞がれることがある)
function micAutoStart() {
  if (!aiChat || !aiChat.handsFree || aiChat.waiting || micListening) return;
  setTimeout(() => {
    if (!aiChat || !aiChat.handsFree || aiChat.waiting || micListening) return;
    toggleMic(true);
    // 起動できなければ手動を促す
    setTimeout(() => {
      if (aiChat && aiChat.handsFree && !micListening && !aiChat.waiting && IS_IOS) {
        aiChat.error = "iPhoneでは自動でマイクが開かないことがあります。🎤を押して話してください。";
        renderAIChat();
      }
    }, 600);
  }, 350);
}

/* ===== 瞬間英作文トレーナー(間隔反復) ===== */
const SRS_INTERVALS = [1, 3, 7, 14, 30]; // ○の回数に応じて次回出題までの日数が伸びる
let srs = JSON.parse(localStorage.getItem("srsData") || "{}");
if (!srs.cards) srs.cards = {};
if (!srs.day) srs.day = {};

function srsDateStr(offsetDays) {
  const d = new Date();
  d.setDate(d.getDate() + (offsetDays || 0));
  return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
}
function srsSave() { localStorage.setItem("srsData", JSON.stringify(srs)); }

// カード素材 = 全職種のスタッフ側セリフ + キーフレーズ集
function srsPool() {
  const pool = [], seen = {};
  JOBS.forEach(j => j.scenes.forEach(s => s.lines.forEach(l => {
    if (l.sp === "S" && !seen[l.en]) { seen[l.en] = 1; pool.push({ en: l.en, ja: l.ja, job: j.id }); }
  })));
  PHRASES.forEach(g => g.items.forEach(it => {
    if (!seen[it.en]) { seen[it.en] = 1; pool.push({ en: it.en, ja: it.ja, job: "phrases" }); }
  }));
  return pool;
}

let sedQueue = [], sedCurrent = null, sedRevealed = false;

function goInstant() {
  stopAll();
  currentScene = -3;
  renderNav();
  startInstantSession(false);
  window.scrollTo({ top: 0, behavior: "smooth" });
}

function setJobFilter(v) {
  srs.jobFilter = v;
  srsSave();
  startInstantSession(false);
}

let sedInfo = { review: 0, fresh: 0, exhausted: false };

function startInstantSession(extraNew) {
  const today = srsDateStr(0);
  if (srs.day.date !== today) srs.day = { date: today, newUsed: 0, reviewsDone: 0, ok: 0, ng: 0, extra: 0 };
  if (extraNew) srs.day.extra = (srs.day.extra || 0) + 5;
  srsSave();
  const filter = srs.jobFilter || "";
  const due = [], fresh = [];
  srsPool().forEach(c => {
    if (filter && c.job !== filter) return; // 職種を選んだら復習も新規もその職種だけ
    const st = srs.cards[c.en];
    if (st) { if (st.d <= today) due.push({ c: c, d: st.d }); }
    else fresh.push(c);
  });
  due.sort((a, b) => (a.d < b.d ? -1 : 1)); // 期限が古い順に復習

  let reviewSlots, newSlots;
  if (filter) {
    // 職種集中モード: 1日の上限に縛られず、その職種を最大20枚
    reviewSlots = 15;
    newSlots = Math.max(0, 20 - Math.min(due.length, reviewSlots)) + (srs.day.extra || 0);
  } else {
    // 通常モード: 今日のメニュー(復習15 + 新規5)
    reviewSlots = Math.max(0, 15 - srs.day.reviewsDone);
    newSlots = Math.max(0, 5 + (srs.day.extra || 0) - srs.day.newUsed);
  }
  const reviewPart = due.slice(0, reviewSlots);
  const freshPart = fresh.slice(0, newSlots);
  sedInfo = {
    review: reviewPart.length,
    fresh: freshPart.length,
    // その職種のカードが尽きた(=全部マスター済みで今日は期限が来ていない)
    exhausted: !!filter && reviewPart.length === 0 && freshPart.length === 0 && fresh.length === 0
  };
  sedQueue = reviewPart.map(x => ({ card: x.c, isNew: false }))
    .concat(freshPart.map(c => ({ card: c, isNew: true })));
  sedNext();
}

function sedNext() {
  sedCurrent = sedQueue.length ? sedQueue.shift() : null;
  sedRevealed = false;
  renderInstant();
}

function sedReveal() {
  if (!sedCurrent || sedRevealed) return;
  sedRevealed = true;
  renderInstant();
  speak(sedCurrent.card.en, false);
}

function sedGrade(ok) {
  if (!sedCurrent) return;
  const en = sedCurrent.card.en;
  const st = srs.cards[en] || { l: 0, d: "" };
  if (ok) {
    st.d = srsDateStr(SRS_INTERVALS[Math.min(st.l, SRS_INTERVALS.length - 1)]);
    st.l = Math.min(st.l + 1, SRS_INTERVALS.length);
    srs.day.ok++;
  } else {
    st.l = 0;
    st.d = srsDateStr(1); // 言えなかったら明日また
    srs.day.ng++;
  }
  srs.cards[en] = st;
  if (sedCurrent.isNew) srs.day.newUsed++; else srs.day.reviewsDone++;
  srsSave();
  markPracticed();
  if (!sedQueue.length) celebrate(); // 今日の分クリア!
  sedNext();
}

function renderInstant() {
  aiChat = null;
  const today = srsDateStr(0);
  const remaining = sedQueue.length + (sedCurrent ? 1 : 0);
  const filter = srs.jobFilter || "";
  const filterName = filter === "phrases" ? "キーフレーズ集"
    : (JOBS.find(j => j.id === filter) || {}).name || "";

  let html = `
    <div class="scene-header">
      <h2>瞬間英作文 — 接客フレーズ</h2>
      <p>日本語を見たら<strong>2秒以内に声に出して</strong>英語で言う → 答えを見て○✗を自己判定。<br>✗は明日、○は1日→3日→7日→14日→30日後に再出題されます。</p>
    </div>

      <span class="section-note">${filter
        ? `🎯 ${esc(filterName)}に集中(復習${sedInfo.review} + 新規${sedInfo.fresh})`
        : `今日のメニュー: 復習${sedInfo.review} + 新規${sedInfo.fresh}`}</span>

             <button class="sed-ok" onclick="sedGrade(true)">○ 2秒で言えた</button>
             <button class="sed-ng" onclick="sedGrade(false)">✗ 言えなかった</button>
           </div>`
        : `<div class="sed-timer"><div></div></div>

    </div>`;
  } else {
    const d = srs.day;
    const dueTomorrow = Object.keys(srs.cards).filter(k => srs.cards[k].d <= srsDateStr(1)).length;
    html += `
    <div class="sed-card">
      <div class="sed-ja">${sedInfo.exhausted
        ? esc(filterName) + "は全部マスター済み! 🎉"
        : "今日の分は完了!おつかれさま 🎉"}</div>
      <p class="section-note" style="margin-top:12px">${sedInfo.exhausted
        ? "この職種の未出題カードはもうありません。復習の期限が来たらまた出題されます。<br>上の「出題範囲」から別の職種を選んでみてください。"
        : `今日の成績: ○ ${d.ok} / ✗ ${d.ng}${d.ng ? "(✗は明日また出ます)" : ""}<br>明日の予定: 復習${Math.min(dueTomorrow, 15)}枚 + 新規5枚`}</p>
      ${sedInfo.exhausted ? "" : `<div class="sed-btns">
        <button onclick="startInstantSession(true)">余力があるので追加で新規5枚</button>
      </div>`}
    </div>`;
  }
  document.getElementById("main").innerHTML = html;
}

/* ===== 青春ギミック: ストリーク & 紙吹雪 ===== */
const JOB_EMOJI = { uber: "🛵", bar: "🍸", japanese: "🍣", steak: "🥩", cafe: "☕", thai: "🍛", kebab: "🌯", hotel: "🛏️", demipair: "🏡", gym: "💪", swim: "🏊", airport: "🛫", flightexp: "✈️", interview: "🤝" };
const WHO_EMOJI = { RESTAURANT: "🏪", CUSTOMER: "🙋", GUEST: "🧳", KID: "🧒", PARENT: "👩", CHEF: "👨‍🍳", SUPERVISOR: "📋", COWORKER: "🤜", MANAGER: "🤝" };

function markPracticed() {
  const t = srsDateStr(0);
  const days = JSON.parse(localStorage.getItem("practiceDays") || "[]");
  if (days.indexOf(t) < 0) {
    days.push(t);
    localStorage.setItem("practiceDays", JSON.stringify(days));
  }
  updateStreakChip();
}

function currentStreak() {
  const days = new Set(JSON.parse(localStorage.getItem("practiceDays") || "[]"));
  const today = days.has(srsDateStr(0));
  const start = today ? 0 : 1;
  let n = 0;
  while (days.has(srsDateStr(-(start + n)))) n++;
  return { n: n, today: today };
}

function updateStreakChip() {
  const el = document.getElementById("streak-chip");
  if (!el) return;
  const s = currentStreak();
  if (s.n === 0) el.textContent = "☀️ 今日から始めよう";
  else if (s.today) el.textContent = "🔥 連続 " + s.n + " 日目!いい波きてる!";
  else el.textContent = "🔥 連続 " + s.n + " 日 — 今日もひと乗りしよう";
}

function celebrate() {
  if (window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const c = document.createElement("canvas");
  c.style.cssText = "position:fixed;inset:0;pointer-events:none;z-index:999;";
  c.width = window.innerWidth;
  c.height = window.innerHeight;
  document.body.appendChild(c);
  const ctx = c.getContext("2d");
  const colors = ["#FF6B4A", "#FFA62B", "#FFD166", "#0E7C86", "#83C5BE", "#FFFFFF"];
  const parts = [];
  for (let i = 0; i < 90; i++) {
    parts.push({
      x: c.width / 2 + (Math.random() - 0.5) * c.width * 0.5,
      y: c.height * 0.35,
      vx: (Math.random() - 0.5) * 9,
      vy: -Math.random() * 9 - 3,
      s: 5 + Math.random() * 6,
      r: Math.random() * Math.PI,
      vr: (Math.random() - 0.5) * 0.3,
      col: colors[(Math.random() * colors.length) | 0]
    });
  }
  let frames = 0;
  (function tick() {
    ctx.clearRect(0, 0, c.width, c.height);
    parts.forEach(p => {
      p.x += p.vx; p.y += p.vy; p.vy += 0.25; p.r += p.vr;
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(p.r);
      ctx.fillStyle = p.col;
      ctx.fillRect(-p.s / 2, -p.s / 2, p.s, p.s * 0.6);
      ctx.restore();
    });
    if (++frames < 110) requestAnimationFrame(tick);
    else c.remove();
  })();
}
